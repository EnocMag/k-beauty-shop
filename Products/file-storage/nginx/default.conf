# 1. Define Caching Zone
# Allocates 10MB of RAM for cache keys and up to 1GB of disk storage.
# Files that haven't been requested in 60 days are automatically pruned.
proxy_cache_path /var/cache/nginx 
                 levels=1:2 
                 keys_zone=STATIC:10m 
                 max_size=1g 
                 inactive=60d 
                 use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    # Maximum allowed upload/request payload size
    client_max_body_size 50M;

    # ----------------------------------------------------------------------
    # 2. RAW ORIGINAL IMAGES
    # Serves untouched files directly from the shared ./catalog_images disk volume
    # URL Example: http://localhost/raw/product123_abc.jpg
    # ----------------------------------------------------------------------
    location /raw/ {
        alias /usr/share/nginx/html/raw/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # Optional: enable CORS if fetching raw images from frontend domains
        add_header Access-Control-Allow-Origin "*";
    }

    # ----------------------------------------------------------------------
    # 3. OPTIMIZED & RESIZED IMAGES (via imgproxy)
    # Intercepts requests, proxies to imgproxy, and caches the result
    # URL Example: http://localhost/media/insecure/rs:fill:600:600/plain/local:///product123_abc.jpg
    # ----------------------------------------------------------------------
    location /media/ {
        # Active Nginx Caching
        proxy_cache STATIC;
        proxy_cache_valid 200 302 60d;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        
        # Header indicating if request hit Nginx cache (HIT) or called imgproxy (MISS)
        add_header X-Cache-Status $upstream_cache_status;

        # Forward request to the catalog_imgproxy container on its internal port
        proxy_pass http://catalog_imgproxy:8080/;
        proxy_set_header Host $host;

        # Pass client headers so imgproxy can negotiate WebP/AVIF support automatically
        proxy_set_header Accept $http_accept;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Client-side caching (Instructs browsers to cache image locally for 1 year)
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ----------------------------------------------------------------------
    # 4. HEALTH CHECK / DEFAULT ROUTE
    # ----------------------------------------------------------------------
    location / {
        return 200 '{"status":"healthy","message":"Catalog File Storage & Optimization Engine Running"}';
        add_header Content-Type application/json;
    }
}